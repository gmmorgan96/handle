{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Handle</a>
    {{if .ProjectName}}<span class="project-name">{{.ProjectName}}</span>{{end}}
    <nav class="site-nav" aria-label="Primary">
      <a href="/blockers">What's blocking me</a>
    </nav>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
  <script>
    // Reload when the server reports that planning files changed. The server
    // coalesces a burst of edits into one event, and the source is closed
    // before reloading so a slow navigation cannot queue another reload.
    (function () {
      if (!window.EventSource) {
        return;
      }
      var source = new EventSource("/events");
      var reloading = false;
      source.addEventListener("change", function () {
        if (reloading) {
          return;
        }
        reloading = true;
        source.close();
        window.location.reload();
      });
    })();
  </script>
</body>
</html>{{end}}
