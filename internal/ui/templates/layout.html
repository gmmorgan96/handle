{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Handle</a>
    {{if .ProjectName}}<span class="project-name">{{.ProjectName}}</span>{{end}}
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
